[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foveance"
version = "0.5.1"
description = "A lossless token-optimization codec for LLM agents — cut input tokens up to 82%, nothing dropped. Drop-in proxy for Claude Code, Codex, Cursor, and any OpenAI/Anthropic client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Abtin Maghsoodi" }]
keywords = ["llm", "agents", "context", "compression", "rate-distortion", "kv-cache"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# `pip install foveance` gives everything a normal user needs: the shrink() one-liner, the
# `foveance wrap`/`proxy` commands, and the offline demo. Only heavy ML / benchmark tooling is
# behind extras. The allocator/predictor core itself imports none of these.
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
ml     = ["sentence-transformers>=2.2", "numpy>=1.24", "torch>=2.0"]
proxy  = []  # the proxy ships in the base install now; this extra is kept as a no-op alias
bench  = ["matplotlib>=3.7", "numpy>=1.24", "tiktoken>=0.6"]
litellm    = ["litellm>=1.0"]             # foveance.integrations.litellm
langchain  = ["langchain-core>=0.2"]      # foveance.integrations.langchain
llamaindex = ["llama-index-core>=0.11"]   # foveance.integrations.llamaindex
dev    = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]
# convenience: base + ML embedder + benchmark tooling in one shot (pip install foveance[all])
all    = ["sentence-transformers>=2.2", "numpy>=1.24", "torch>=2.0",
         "matplotlib>=3.7", "tiktoken>=0.6"]

[project.scripts]
foveance = "foveance.cli:main"   # provided by PROMPT_1 (cli.py)

[project.urls]
Homepage = "https://github.com/aimaghsoodi/foveance"
Repository = "https://github.com/aimaghsoodi/foveance"
Documentation = "https://github.com/aimaghsoodi/foveance/tree/main/docs"
Changelog = "https://github.com/aimaghsoodi/foveance/blob/main/CHANGELOG.md"
Issues = "https://github.com/aimaghsoodi/foveance/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/foveance"]

[tool.hatch.build.targets.sdist]
# The published archive is the product: what you need to build, install, test and run Foveance.
# Nothing else. The measured *results* stay in (bench/plots/*.png, bench/results_replay/*.csv)
# because they are the evidence behind the README's numbers; the harness that produced them is
# manuscript tooling and lives in the git repo, which is where reproduction happens.
exclude = [
  "/assets",              # README/social images; referenced by absolute GitHub raw URL, so they
                          # render on PyPI without shipping ~2.2 MB of GIFs and logos.
  "**/*.pdf",             # vector figures are for the manuscript; the PNGs carry identical data.
  "/.github",             # CI definitions are repo infrastructure, not part of the distribution.
  "/bench/*.py",          # the paper's benchmark harness (keep bench/results_replay + bench/plots).
  "/bench/suites",
  "/bench/traces",
  "/tests/test_paper2_bench.py",   # tests the harness above; would ImportError without it.
  "/scripts",             # maintainer/release scripts.
  "/data",                # fetched benchmark inputs (LongBench/RULER); re-fetchable, and gitignored.
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E731: short value/cost closures (vc, cost_fn) read more clearly inline than as nested defs.
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# The seed test doubles as a no-pytest script runner (sys.path shim + __main__ harness).
"tests/test_allocator.py" = ["E402", "E702", "E401"]
# bench/ holds dense analysis utility scripts (matplotlib/csv one-liners), not library code.
"bench/*.py" = ["E702", "E401", "E741", "F541"]

[tool.mypy]
# No python_version pin: mypy targets the running interpreter, so third-party stubs installed
# for that interpreter (e.g. numpy's PEP 695 `type` statements on 3.12+) always parse.
ignore_missing_imports = true
